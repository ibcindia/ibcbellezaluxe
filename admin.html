<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>IBC Belleza Luxé – Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f2f6;--ink:#1a1820;--mute:#6b6874;--line:#e4e0e9;--acc:#5b2a4e;--tint:#f0e8ef;--bad:#b3261e;--serif:"Cormorant Garamond",Georgia,serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Instrument Sans",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.hide{display:none!important}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:6px;background:#fff}
label{display:block;font-size:13px;font-weight:500;margin:12px 0 4px}
.btn{padding:8px 16px;border-radius:7px;border:1px solid var(--acc);background:var(--acc);color:#fff;cursor:pointer;font-weight:500;display:inline-block}
.btn.g{background:#fff;color:var(--acc)}.btn.d{background:#fff;color:var(--bad);border-color:#e3c3c0}
.btn.s{padding:3px 10px;font-size:13px}.btn:disabled{opacity:.5;cursor:wait}
h1{font:600 32px var(--serif);margin:0}
.gate{max-width:400px;margin:8vh auto;background:#fff;padding:32px;border-radius:12px;border:1px solid var(--line)}
.gate h1{margin-bottom:6px}.gate .btn{width:100%;margin-top:18px;padding:11px}
.gate ol{font-size:13px;color:var(--mute);padding-left:18px}
.bar{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.brand{font:700 22px var(--serif)}.bar small{color:var(--mute);margin:0 12px}
.shell{display:grid;grid-template-columns:200px 1fr;gap:24px;max-width:1200px;margin:0 auto;padding:22px 20px 80px}
aside button{display:block;width:100%;text-align:left;padding:9px 12px;border:0;background:none;border-radius:6px;cursor:pointer}
aside button.on{background:var(--tint);color:var(--acc);font-weight:600}
aside a{display:block;padding:9px 12px;color:var(--acc);font-size:14px}
@media(max-width:800px){.shell{grid-template-columns:1fr}aside{display:flex;flex-wrap:wrap}aside button,aside a{width:auto}}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap}
.f{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}.f input{max-width:280px}
.seg button{padding:6px 14px;border:1px solid var(--line);background:#fff;cursor:pointer;text-transform:capitalize}
.seg button.on{background:var(--acc);color:#fff}
.rows{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row{display:flex;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);cursor:pointer}
.row:first-child{border:0}.row:hover{background:#faf8fb}
.row img,.row i{width:64px;height:46px;object-fit:cover;border-radius:5px;background:var(--line);flex:none}
.row .t{flex:1;min-width:0}.row b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row span{font-size:13px;color:var(--mute)}
.tag{background:var(--tint);color:var(--acc);border-radius:99px;padding:1px 9px;font-size:12px;margin-left:8px}
.em{padding:36px;text-align:center;color:var(--mute)}
.ed{display:grid;grid-template-columns:1fr 290px;gap:22px;align-items:start}
@media(max-width:950px){.ed{grid-template-columns:1fr}}
.paper,.box{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px}
.ttl{font:600 36px/1.15 var(--serif);border:0;border-bottom:1px solid var(--line);border-radius:0;padding:4px 0 10px}
.tb{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 8px;position:sticky;top:56px;background:#fff;padding:6px 0;z-index:3}
.tb button{min-width:36px;padding:5px 9px;border:1px solid var(--line);background:#fff;border-radius:6px;cursor:pointer}
#bd{min-height:380px;border:1px solid var(--line);border-radius:6px;padding:16px;font:18px/1.7 var(--serif);outline-color:var(--acc)}
#bd img,.prose img{max-width:100%;height:auto}
#bd h2{font:600 28px var(--serif);margin:1em 0 .3em}
#bd blockquote{border-left:3px solid var(--acc);margin:1em 0;padding-left:16px;color:var(--acc);font-style:italic}
#pv{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:6px;background:var(--line);margin-bottom:8px}
.side{display:grid;gap:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.grid figure{margin:0;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.grid img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--line)}
.grid div{display:flex;gap:6px;padding:6px;justify-content:center}
dialog{width:min(820px,94vw);border:0;border-radius:12px;padding:20px;max-height:86vh}
dialog::backdrop{background:rgba(20,10,20,.5)}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;opacity:0;pointer-events:none;transition:.2s;max-width:90vw;z-index:50}
#toast.on{opacity:1}#toast.err{background:var(--bad)}
input[type=checkbox]{width:auto;margin-right:6px}.chk{font-weight:400;margin:6px 0}
</style>
</head>
<body>
<div id="gate" class="gate">
  <h1>IBC Belleza Luxé</h1>
  <p style="color:var(--mute);margin:0 0 6px">Sign in to manage your site.</p>
  <form id="cf">
    <label>GitHub repository (owner/name)</label><input id="repo" placeholder="yourname/your-site" required>
    <label>Branch</label><input id="branch" value="main">
    <label>Access token</label><input id="token" type="password" placeholder="github_pat_…" required>
    <details style="margin-top:10px"><summary>How do I get a token?</summary><ol>
      <li>GitHub → Settings → Developer settings → Fine-grained tokens → Generate new token.</li>
      <li>Repository access: only your site repository.</li>
      <li>Permissions → Contents: <b>Read and write</b>.</li></ol></details>
    <button class="btn" id="go">Connect</button>
  </form>
</div>

<div id="app" class="hide">
  <header class="bar"><span class="brand">IBC Belleza Luxé <small>Admin</small></span><span><small id="conn"></small><button class="btn g s" id="out">Sign out</button></span></header>
  <div class="shell">
    <aside id="nav"><button data-v="post">Posts</button><button data-v="page">Pages</button><button data-v="media">Media</button><a href="index.html" target="_blank">View site ↗</a></aside>
    <main id="main"></main>
  </div>
</div>
<dialog id="dlg"><div id="dbody"></div><p style="text-align:right;margin:12px 0 0"><button class="btn g" onclick="dlg.close()">Close</button></p></dialog>
<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const slug = s => String(s || '').normalize('NFC').toLowerCase().trim()
  .replace(/[^\p{L}\p{N}]+/gu, '-').replace(/^-|-$/g, '') || 'article';
const SEC = {'':'Normal (shown in its category on Home)', cover:'Cover story', featured:'Top picks', trending:'Trending Now'};
const PATH = 'content/articles.json';
let cfg = JSON.parse(localStorage.getItem('ibcAdmin') || '{}'), data = [], sha = null, view = 'post', flt = 'all', q = '', cur = null, dirty = false, range = null;
const raw = () => 'https://raw.githubusercontent.com/' + cfg.repo + '/' + cfg.branch + '/';
const toEd = h => h.replace(/src="uploads\//g, 'src="' + raw() + 'uploads/');
const fromEd = h => h.split(raw()).join('');
const imgSrc = v => !v ? '' : /^(https?:|data:)/.test(v) ? v : raw() + v;
const publicBase = () => location.hostname.endsWith('github.io')
  ? location.origin + '/' + cfg.repo.split('/')[1] + '/'
  : location.origin + location.pathname.replace(/admin\.html?$/i, '');
const absoluteImage = v => !v ? '' : /^(https?:)/.test(v) ? v : publicBase() + String(v).replace(/^\//, '');
const postUrl = a => publicBase() + 'articles/' + encodeURIComponent(a.slug || a.id) + '/';
const staticArticle = a => {
  const title = esc(a.title), desc = esc(a.excerpt || a.title), url = postUrl(a), image = absoluteImage(a.image);
  const body = (a.format === 'html' ? (a.body || '') : md(a.body || ''))
    .replace(/src="uploads\//g, 'src="' + publicBase() + 'uploads/');
  const navCats = [...new Set(data
    .filter(x => (x.type || 'post') !== 'page' && !['cover', 'featured', 'trending'].includes(x.section))
    .map(x => x.category || 'More stories'))];
  const navPages = data.filter(x => x.type === 'page' && x.menu);
  const pageHref = p => p.link || (p.type === 'page' || !p.slug
    ? publicBase() + 'article.html?id=' + encodeURIComponent(p.id)
    : publicBase() + 'articles/' + encodeURIComponent(p.slug) + '/');
  const navHtml = '<a href="' + publicBase() + '">Home</a>' +
    navCats.map(c => '<a href="' + publicBase() + '#c-' + slug(c) + '">' + esc(c) + '</a>').join('') +
    (data.some(x => (x.type || 'post') !== 'page' && x.section === 'trending')
      ? '<a href="' + publicBase() + '#trending">Trending</a>' : '') +
    navPages.map(p => '<a href="' + esc(pageHref(p)) + '">' + esc(p.title) + '</a>').join('');
  return '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">' +
    '<title>' + title + ' | IBC BELLEZA LUXÉ</title><meta name="description" content="' + desc + '">' +
    '<link rel="canonical" href="' + url + '">' +
    '<meta property="og:type" content="article"><meta property="og:site_name" content="IBC BELLEZA LUXÉ">' +
    '<meta property="og:title" content="' + title + '"><meta property="og:description" content="' + desc + '">' +
    '<meta property="og:url" content="' + url + '">' + (image ? '<meta property="og:image" content="' + esc(image) + '"><meta property="og:image:secure_url" content="' + esc(image) + '">' : '') +
    '<meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="' + title + '">' +
    '<meta name="twitter:description" content="' + desc + '">' + (image ? '<meta name="twitter:image" content="' + esc(image) + '">' : '') +
    '<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">' +
    '<style>*{box-sizing:border-box}body{margin:0;color:#1a1820;background:#fff;font:16px/1.6 Instrument Sans,Arial,sans-serif}.site-header{border-bottom:1px solid #e9e3e8;text-align:center;padding:22px 18px 14px}.brand{display:inline-block;color:#1a1820;text-decoration:none;font:600 30px/1.1 Cormorant Garamond,Georgia,serif;letter-spacing:.02em}.tag{margin:5px 0 0;color:#786b76;font-size:12px;letter-spacing:.12em}.site-nav{display:flex;justify-content:center;gap:26px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid #eee8ed}.site-nav a{color:#5b2a4e;text-decoration:none;font-size:14px}.site-nav a:hover{text-decoration:underline}.art{max-width:760px;margin:32px auto;padding:0 20px}.art h1{font:600 clamp(32px,5vw,50px)/1.1 Cormorant Garamond,Georgia,serif}.hero{width:100%;height:auto;margin:12px 0 20px}.prose{font-size:18px;line-height:1.8}.prose img{max-width:100%;height:auto}.prose h2{font:600 28px Cormorant Garamond,Georgia,serif}.site-footer{margin-top:55px;padding:28px 18px;text-align:center;border-top:1px solid #e9e3e8;color:#786b76;font-size:13px}.site-footer a{color:#5b2a4e}a{color:#5b2a4e}@media(max-width:600px){.brand{font-size:25px}.site-nav{gap:16px}}</style></head><body>' +
    '<header class="site-header"><a class="brand" href="' + publicBase() + '">IBC BELLEZA LUXÉ.</a><p class="tag">The art of living beautifully</p></header>' +
    '<nav class="site-nav" aria-label="Main navigation">' + navHtml + '</nav>' +
    '<article class="art"><small>' + esc(a.category || '') + (a.readTime ? ' • ' + esc(a.readTime) : '') + '</small><h1>' + title + '</h1>' +
    (image ? '<img class="hero" src="' + esc(image) + '" alt="' + title + '">' : '') + '<div class="prose">' + body + '</div></article>' +
    '<footer class="site-footer"><a class="brand" href="' + publicBase() + '">IBC BELLEZA LUXÉ.</a><p>© 2026 IBC BELLEZA LUXÉ. All Rights Reserved.</p></footer></body></html>';
};
async function publishStaticArticle(a) {
  const path = 'articles/' + (a.slug || a.id) + '/index.html';
  const old = await gh(path);
  const body = { message: 'Admin: publish article page "' + a.title + '"', content: b64(staticArticle(a)) };
  if (old.ok) body.sha = (await old.json()).sha;
  else if (old.status !== 404) await fail(old, 'Could not check article page');
  await queue(() => putRetry(path, body, 'Article page publish failed'));
}

function toast(m, e) { const t = $('#toast'); t.textContent = m; t.className = 'on' + (e ? ' err' : ''); clearTimeout(toast.t); toast.t = setTimeout(() => t.className = '', 4500); }
function b64(s) { const u = new TextEncoder().encode(s); let o = ''; for (let i = 0; i < u.length; i += 8192) o += String.fromCharCode(...u.subarray(i, i + 8192)); return btoa(o); }
function unb64(c) { return new TextDecoder().decode(Uint8Array.from(atob(c.replace(/\n/g, '')), x => x.charCodeAt(0))); }
async function run(btn, fn, busy) {
  const old = btn && btn.textContent; if (btn) { btn.disabled = true; if (busy) btn.textContent = busy; }
  try { await fn(); } catch (e) { toast(e.message, true); }
  if (btn) { btn.disabled = false; if (busy) btn.textContent = old; }
}

/* ---- GitHub (all writes go one at a time: this prevents most upload errors) ---- */
let chain = Promise.resolve();
const queue = f => { const p = chain.then(f); chain = p.catch(() => {}); return p; };
const wait = ms => new Promise(r => setTimeout(r, ms));
function gh(path, o = {}) {
  const m = o.method || 'GET';
  const url = 'https://api.github.com/repos/' + cfg.repo + '/contents/' + path + (m === 'GET' ? '?ref=' + encodeURIComponent(cfg.branch) : '');
  return fetch(url, { method: m, headers: { Authorization: 'Bearer ' + cfg.token, Accept: 'application/vnd.github+json' },
    body: o.body ? JSON.stringify({ ...o.body, branch: cfg.branch }) : undefined });
}
async function fail(r, what) {
  const j = await r.json().catch(() => ({}));
  const m = { 401: 'The token is wrong or expired. Create a new one.',
    403: 'The token cannot write to this repository. Give it "Contents: Read and write".',
    404: 'Repository or branch not found, or the token has no access to it.',
    413: 'The file is too large.' }[r.status] || j.message || ('error ' + r.status);
  throw new Error(what + ': ' + m);
}
async function putRetry(path, body, what) {
  for (let t = 0; t < 4; t++) {
    const r = await gh(path, { method: 'PUT', body });
    if (r.ok) return r.json();
    if (r.status === 409 || r.status === 422 || r.status >= 500) { await wait(800 * (t + 1)); if (body.sha !== undefined) { const latestResponse = await gh(path); if (latestResponse.ok) { const latestFile = await latestResponse.json(); body.sha = latestFile.sha; } } continue; }
    await fail(r, what);
  }
  throw new Error(what + ': GitHub is busy. Wait a few seconds and try again.');
}
async function load() {
  const r = await gh(PATH);
  if (r.status === 404) { data = []; sha = null; return; }
  if (!r.ok) await fail(r, 'Could not load articles');
  const j = await r.json(); sha = j.sha; data = JSON.parse(unb64(j.content) || '[]');
}
const commit = msg => queue(async () => {
  const body = { message: msg, content: b64(JSON.stringify(data, null, 2)) };
  if (sha) body.sha = sha;
  sha = (await putRetry(PATH, body, 'Save failed')).content.sha;
});
async function mutate(fn, msg) {
  const bak = JSON.stringify(data); fn();
  try { await commit(msg); } catch (e) { data = JSON.parse(bak); throw e; }
}

/* ---- images ---- */
async function shrink(f) {
  let bm;
  try { bm = await createImageBitmap(f, { imageOrientation: 'from-image' }); }
  catch (e) { throw new Error('This image cannot be read. Use JPG, PNG or WebP (HEIC photos: export as JPG first).'); }
  const s = Math.min(1, 1600 / Math.max(bm.width, bm.height)), c = document.createElement('canvas');
  c.width = Math.round(bm.width * s); c.height = Math.round(bm.height * s);
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(bm, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', .86).split(',')[1];
}
async function upload(f) {
  const content = await shrink(f);
  const n = 'uploads/' + Date.now() + '-' + (slug(f.name.replace(/\.[^.]+$/, '')) || 'image') + '.jpg';
  await queue(() => putRetry(n, { message: 'Admin: upload ' + n, content }, 'Upload failed'));
  return n;
}
async function media(el, pick) {
  el.innerHTML = '<p class="em">Loading…</p>';
  const r = await gh('uploads');
  if (!r.ok && r.status !== 404) await fail(r, 'Could not load media');
  const L = r.ok ? (await r.json()).filter(x => /\.(jpe?g|png|webp|gif)$/i.test(x.name)).reverse() : [];
  el.innerHTML = '<div class="hd"><h1>' + (pick ? 'Choose an image' : 'Media') + '</h1><label class="btn" style="margin:0">Upload images<input type="file" accept="image/*" multiple hidden></label></div>' +
    (L.length ? '<div class="grid">' + L.map(x => '<figure data-p="' + esc(x.path) + '" data-s="' + x.sha + '"><img loading="lazy" src="' + esc(raw() + x.path) + '" alt=""><div>' +
      (pick ? '<button class="btn s" data-a="use">Use</button>' : '') + '<button class="btn s d" data-a="del">Delete</button></div></figure>').join('') + '</div>' : '<p class="em">No images yet. Upload your first one.</p>');
  el.querySelector('input').onchange = async e => {
    const fs = [...e.target.files]; let n = 0;
    for (const f of fs) { try { toast('Uploading ' + (++n) + ' of ' + fs.length + '…'); const p = await upload(f); if (pick && fs.length === 1) return pick(p); } catch (er) { toast(er.message, true); return; } }
    toast('Uploaded'); media(el, pick);
  };
  el.onclick = e => {
    const b = e.target.closest('[data-a]'); if (!b) return; const fg = b.closest('figure');
    if (b.dataset.a === 'use') return pick(fg.dataset.p);
    if (!confirm('Delete this image? Posts using it will lose their picture.')) return;
    run(b, async () => { await queue(async () => { const r = await gh(fg.dataset.p, { method: 'DELETE', body: { message: 'Admin: delete image', sha: fg.dataset.s } }); if (!r.ok) await fail(r, 'Delete failed'); }); fg.remove(); toast('Deleted'); });
  };
}

/* ---- legacy markdown -> html ---- */
const md = s => esc(s).split(/\n{2,}/).map(b => /^## /.test(b) ? '<h2>' + b.slice(3) + '</h2>' : /^&gt; /.test(b) ? '<blockquote>' + b.slice(5) + '</blockquote>' :
  /^- /.test(b) ? '<ul>' + b.split('\n').map(l => '<li>' + l.slice(2) + '</li>').join('') + '</ul>' : '<p>' + b.replace(/\n/g, '<br>') + '</p>').join('').replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');

/* ---- list ---- */
function show(v) {
  if (dirty && !confirm('You have unsaved changes. Leave without saving?')) return;
  dirty = false; view = v; flt = 'all'; q = '';
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  if (v === 'media') { $('#main').innerHTML = ''; return run(null, () => media($('#main'))); }
  const nm = v === 'post' ? 'Posts' : 'Pages';
  $('#main').innerHTML = '<div class="hd"><h1>' + nm + '</h1><button class="btn" id="add">Add new</button></div><div class="f"><div class="seg">' +
    ['all', 'published', 'draft'].map(s => '<button data-s="' + s + '"' + (s === 'all' ? ' class="on"' : '') + '>' + s + '</button>').join('') + '</div><input id="q" placeholder="Search"></div><div class="rows" id="rows"></div>';
  $('#add').onclick = () => edit(null);
  $('#q').oninput = e => { q = e.target.value.toLowerCase(); rows(); };
  document.querySelector('.seg').onclick = e => { const b = e.target.closest('button'); if (!b) return; flt = b.dataset.s; document.querySelectorAll('.seg button').forEach(x => x.classList.toggle('on', x === b)); rows(); };
  rows();
}
function rows() {
  const L = data.filter(a => (a.type || 'post') === view && (flt === 'all' || (a.status || 'published') === flt) && (a.title + ' ' + (a.category || '')).toLowerCase().includes(q));
  $('#rows').innerHTML = L.map(a => '<div class="row" data-id="' + esc(a.id) + '">' + (a.image ? '<img src="' + esc(imgSrc(a.image)) + '" alt="">' : '<i></i>') +
    '<div class="t"><b>' + esc(a.title) + (a.status === 'draft' ? '<span class="tag">Draft</span>' : '') + '</b><span>' + esc(view === 'post' ? (a.category || '') + ' · ' + (SEC[a.section] || 'Normal') : '/' + a.id + (a.menu ? ' · In menu' : '') + (a.footer !== false ? ' · In footer' : '')) + '</span></div>' +
    '<button class="btn d s" data-del="' + esc(a.id) + '">Delete</button></div>').join('') || '<p class="em">Nothing here yet. Click “Add new”.</p>';
}
$('#main').addEventListener('click', e => {
  if (view === 'media' || !$('#rows')) return;
  const d = e.target.closest('[data-del]');
  if (d) { const a = data.find(x => x.id === d.dataset.del); if (a && confirm('Delete "' + a.title + '"? This cannot be undone.')) run(d, async () => { await mutate(() => data = data.filter(x => x !== a), 'Admin: delete "' + a.title + '"'); rows(); toast('Deleted'); }); return; }
  const r = e.target.closest('.row'); if (r) edit(data.find(x => x.id === r.dataset.id));
});

/* ---- editor ---- */
const cats = () => [...new Set(data.filter(x => (x.type || 'post') !== 'page' && x.category).map(x => x.category))];
const dl = () => '<datalist id="cl">' + cats().map(c => '<option value="' + esc(c) + '">').join('') + '</datalist>';
const ck = (on, cls, v, t) => '<label class="chk"><input type="checkbox" class="' + cls + '" value="' + esc(v) + '"' + (on ? ' checked' : '') + '> ' + esc(t) + '</label>';
const pageBox = () => '<div class="box"><b>Page settings</b>' + ck(cur.menu, 'o', 'menu', 'Show in top menu') + ck(cur.footer !== false, 'o', 'footer', 'Show in footer') +
  '<label>Auto-list a category here (optional)</label><input id="lc" list="cl" value="' + esc(cur.listCat || '') + '" placeholder="e.g. Fashion">' + dl() + '</div>';
const postPages = () => { const P = data.filter(x => x.type === 'page'); return '<div class="box"><b>Also show on pages</b>' +
  (P.length ? P.map(p => ck((cur.showOn || []).includes(p.id), 'sp', p.id, p.title)).join('') : '<p class="em" style="padding:8px">No pages yet.</p>') + '</div>'; };
function edit(a) {
  const isNew = !a; cur = a ? { ...a } : { id: '', slug: '', type: view, status: 'draft', section: '', category: '', title: '', excerpt: '', readTime: '', image: '', body: '', showOn: [], menu: false, footer: true, listCat: '' };
  const page = cur.type === 'page', html = toEd(a && a.format !== 'html' ? md(a.body || '') : cur.body);
  dirty = false;
  $('#main').innerHTML = '<div class="hd"><button class="btn g" id="bk">← Back</button><span><button class="btn g" id="sd">Save draft</button> <button class="btn" id="pb">Publish</button></span></div>' +
    '<div class="ed"><div class="paper"><input class="ttl" id="ti" placeholder="Add title" value="' + esc(cur.title) + '">' +
    (page ? '<label>Permalink (web address)</label><input id="sl" value="' + esc(cur.id) + '" placeholder="about-us"' + (isNew ? '' : ' disabled') + '>' :
      '<label>Article URL (auto-generated from title)</label><input id="slug" value="' + esc(cur.slug || (cur.title ? slug(cur.title) : '')) + '" placeholder="article-title"><small style="color:var(--mute)">Title बदलल्यास URL आपोआप अपडेट होईल. आवश्यक असल्यास येथे बदल करू शकता.</small>') +
    '<div class="tb" id="tb"><button data-c="bold"><b>B</b></button><button data-c="italic"><i>I</i></button><button data-c="h2">H2</button><button data-c="blockquote">❝</button><button data-c="ul">• List</button><button data-c="link">Link</button><button data-c="img">Image</button><button data-c="clear">Clear</button></div>' +
    '<div id="bd" contenteditable="true">' + html + '</div></div><div class="side">' +
    '<div class="box"><b>Status</b><select id="st"><option value="draft">Draft</option><option value="published">Published</option></select></div>' +
    (page ? pageBox() : postPages() + '<div class="box"><b>Post details</b><label>Home page section</label><select id="se">' + Object.entries(SEC).map(([k, v]) => '<option value="' + k + '">' + v + '</option>').join('') + '</select>' +
      '<label>Category</label><input id="ca" list="cl" value="' + esc(cur.category) + '" placeholder="Fashion, Beauty, Travel…">' + dl() + '<label>Short description</label><textarea id="ex" rows="3">' + esc(cur.excerpt) + '</textarea><label>Read time</label><input id="rt" value="' + esc(cur.readTime) + '" placeholder="Leave empty for automatic"></div>' +
      '<div class="box"><b>Featured image</b><img id="pv" alt="" class="hide"><input id="im" value="' + esc(cur.image) + '" placeholder="Image address"><p style="margin:8px 0 0"><button class="btn s" id="ch">Choose or upload</button></p></div>') +
    '</div></div>';
  $('#st').value = cur.status || 'published'; if (!page) $('#se').value = SEC[cur.section] !== undefined ? cur.section : '';
  const pv = () => { const v = $('#im').value.trim(), i = $('#pv'); i.src = imgSrc(v); i.classList.toggle('hide', !v); };
  if (!page) { pv(); $('#im').oninput = pv; $('#ch').onclick = () => { $('#dlg').showModal(); run(null, () => media($('#dbody'), p => { $('#im').value = p; pv(); dirty = true; $('#dlg').close(); })); }; }
  $('#main').oninput = () => dirty = true;
  if (!page) {
    let slugManuallyEdited = !!cur.slug;
    $('#slug').addEventListener('input', () => { slugManuallyEdited = true; });
    $('#ti').addEventListener('input', () => { if (!slugManuallyEdited) $('#slug').value = slug($('#ti').value); });
  }
  $('#bk').onclick = () => show(view);
  $('#sd').onclick = e => run(e.target, () => save('draft'), 'Saving…');
  $('#pb').onclick = e => run(e.target, () => save('published'), 'Publishing…');
  const tb = $('#tb'); tb.onmousedown = e => e.preventDefault();
  document.addEventListener('selectionchange', () => { const s = getSelection(); if (s.rangeCount && $('#bd') && $('#bd').contains(s.anchorNode)) range = s.getRangeAt(0); });
  tb.onclick = e => {
    const c = e.target.closest('button')?.dataset.c; if (!c) return; $('#bd').focus(); dirty = true;
    if (c === 'h2' || c === 'blockquote') document.execCommand('formatBlock', false, document.queryCommandValue('formatBlock') === c ? 'p' : c);
    else if (c === 'ul') document.execCommand('insertUnorderedList');
    else if (c === 'clear') document.execCommand('removeFormat');
    else if (c === 'link') { const u = prompt('Link address (https://…)'); if (u) document.execCommand('createLink', false, u); }
    else if (c === 'img') { $('#dlg').showModal(); run(null, () => media($('#dbody'), p => { $('#dlg').close(); const b = $('#bd'); b.focus(); const s = getSelection(); if (range) { s.removeAllRanges(); s.addRange(range); } document.execCommand('insertImage', false, raw() + p); dirty = true; })); }
    else document.execCommand(c);
  };
}
async function save(status) {
  const title = $('#ti').value.trim(); if (!title) throw new Error('Add a title.');
  const page = cur.type === 'page'; let id = cur.id;
  if (!id) { id = page ? slug($('#sl').value || title) : uid(); if (!id || data.some(x => x.id === id)) throw new Error('This permalink is already used. Choose another.'); }
  const body = fromEd($('#bd').innerHTML), words = $('#bd').innerText.trim().split(/\s+/).filter(Boolean).length;
  const a = { ...cur, id, title, status, body, format: 'html', date: cur.date || new Date().toISOString() };
  if (!page) {
    Object.assign(a, { section: $('#se').value, category: $('#ca').value.trim(), excerpt: $('#ex').value.trim(), image: $('#im').value.trim(), slug: slug($('#slug').value || title) });
    if (data.some(x => x.id !== id && (x.slug || slug(x.title || '')) === a.slug)) throw new Error('This article URL is already used. Change the URL slug.');
    a.readTime = $('#rt').value.trim() || Math.max(1, Math.round(words / 200)) + ' min read';
    if (status === 'published' && !a.image) throw new Error('Add a featured image before publishing.');
  }
  const o = k => document.querySelector('.o[value="' + k + '"]').checked;
  if (page) Object.assign(a, { menu: o('menu'), footer: o('footer'), listCat: $('#lc').value.trim() }); else a.showOn = [...document.querySelectorAll('.sp:checked')].map(x => x.value);
  const i = data.findIndex(x => x.id === id);
  await mutate(() => { if (i >= 0) data[i] = a; else if (page) data.push(a); else data.unshift(a); }, 'Admin: ' + (i >= 0 ? 'update' : 'add') + ' "' + title + '"');
  if (!page && status === 'published') await publishStaticArticle(a);
  dirty = false; show(view); toast(status === 'published' ? 'Published. Article URL and social preview page created.' : 'Draft saved.');
}

/* ---- connect ---- */
async function start() {
  $('#gate').classList.add('hide'); $('#app').classList.remove('hide');
  const r = await fetch('https://api.github.com/repos/' + cfg.repo, { headers: { Authorization: 'Bearer ' + cfg.token } });
  if (!r.ok) await fail(r, 'Cannot connect');
  const j = await r.json();
  if (j.permissions && j.permissions.push === false) throw new Error('This token can only read. Give it "Contents: Read and write".');
  await load(); $('#conn').textContent = cfg.repo + ' · ' + cfg.branch; show('post');
}
function gate(msg) { $('#gate').classList.remove('hide'); $('#app').classList.add('hide'); if (msg) toast(msg, true); }
$('#repo').value = cfg.repo || ''; $('#branch').value = cfg.branch || 'main';
$('#cf').onsubmit = e => { e.preventDefault(); run($('#go'), async () => {
  const repo = $('#repo').value.trim().replace(/^https?:\/\/github\.com\//, '').replace(/\/$/, '');
  if (!/^[\w.-]+\/[\w.-]+$/.test(repo)) throw new Error('Enter the repository as owner/name.');
  cfg = { repo, token: $('#token').value.trim(), branch: $('#branch').value.trim() || 'main' };
  try { await start(); } catch (er) { gate(); throw er; }
  localStorage.setItem('ibcAdmin', JSON.stringify(cfg));
}, 'Connecting…'); };
$('#out').onclick = () => { localStorage.removeItem('ibcAdmin'); location.reload(); };
$('#nav').onclick = e => { const b = e.target.closest('button'); if (b) show(b.dataset.v); };
window.addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
if (cfg.repo && cfg.token) start().catch(er => gate(er.message));
</script>
</body>
</html>
