<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>IBC BELLEZA LUXÉ</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#1a1820;--mute:#6b6874;--line:#e6e3ea;--acc:#5b2a4e;--soft:#f6f4f7}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;color:var(--ink);background:#fff;font:16px/1.6 "Instrument Sans",system-ui,sans-serif}
a{color:inherit;text-decoration:none}
.top{text-align:center;padding:20px 24px 8px}
.brand{font:700 clamp(28px,5vw,40px) "Cormorant Garamond",Georgia,serif;letter-spacing:.04em}
.tag{color:var(--mute);font-size:14px;margin:0}
nav{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 26px;padding:12px 24px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:5}
nav a{padding:4px 0;border-bottom:2px solid transparent;font-size:15px}
nav a:hover,nav a:focus-visible{border-color:var(--acc);outline:none}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
.cover{position:relative;display:block;margin-top:24px;min-height:min(70vw,540px);background:#222 center/cover;border-radius:4px;overflow:hidden;color:#fff}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 30%,rgba(10,8,14,.82))}
.cover div{position:absolute;left:0;right:0;bottom:0;padding:clamp(20px,4vw,48px);z-index:1;max-width:760px}
.cover small{font-size:15px;opacity:.9}
.cover h1{font:600 clamp(32px,6vw,58px)/1.08 "Cormorant Garamond",Georgia,serif;margin:6px 0 10px}
.cover p{margin:0;font-size:18px;opacity:.92}
h2{font:600 clamp(28px,4vw,38px) "Cormorant Garamond",Georgia,serif;margin:56px 0 18px}
.grid{display:grid;gap:22px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.card img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:4px;background:var(--soft)}
.card small{display:block;margin-top:10px;color:var(--acc);font-weight:500;font-size:14px}
.card h3{font:600 23px/1.2 "Cormorant Garamond",Georgia,serif;margin:2px 0 6px}
.card p{margin:0;color:var(--mute);font-size:15px}
.card:hover h3{text-decoration:underline}
.two{grid-template-columns:repeat(auto-fit,minmax(300px,1fr));margin-top:24px}
.two .card img{aspect-ratio:16/10}
.news{margin:64px 0 0;background:var(--soft);padding:44px 24px;text-align:center}
.news h2{margin:0 0 6px}
.news p{margin:0 0 18px;color:var(--mute)}
.news form{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.news input{padding:11px 14px;border:1px solid var(--line);border-radius:6px;font:inherit;min-width:260px}
.news button{padding:11px 22px;border:0;border-radius:6px;background:var(--acc);color:#fff;font:inherit;font-weight:500;cursor:pointer}
footer{padding:36px 24px;text-align:center;color:var(--mute);font-size:15px}
footer .brand{color:var(--ink);font-size:26px}
footer p{margin:10px auto;max-width:520px}
footer a{margin:0 10px}
.empty{padding:40px 0;color:var(--mute)}
.art{max-width:760px;margin:32px auto}.art h1{font:600 clamp(32px,5vw,50px)/1.1 "Cormorant Garamond",Georgia,serif;margin:6px 0 16px}.art .hero{width:100%;border-radius:4px;margin-bottom:20px}.art small{color:var(--acc);font-weight:500}.prose{font-size:18px;line-height:1.8}.prose img{max-width:100%;height:auto}.prose blockquote{border-left:3px solid var(--acc);margin:1em 0;padding-left:16px;font-style:italic;color:var(--acc)}.prose h2{margin:1.2em 0 .4em}
/* IBC Belleza Luxé unified visual identity */

:root{--ink:#171916;--mute:#74766f;--line:#e7e4dc;--acc:#9a7440;--soft:#f3f0e9;--green:#102c27;--gold:#c6a56a}
body{background:#fbfaf7;color:var(--ink);font-family:"DM Sans","Instrument Sans",Arial,sans-serif}
.top{background:#fbfaf7;padding:25px 20px 17px;border-bottom:1px solid var(--line)}
.brand{font-family:"Playfair Display","Cormorant Garamond",Georgia,serif;color:var(--green);letter-spacing:.035em}
.tag{font-family:"DM Sans",Arial,sans-serif;color:var(--mute);font-size:10px;letter-spacing:.2em;text-transform:uppercase}
nav{background:rgba(251,250,247,.97);border-color:var(--line);backdrop-filter:blur(10px)}
nav a{font-family:"DM Sans",Arial,sans-serif;font-size:10px;font-weight:700;letter-spacing:.13em;text-transform:uppercase}
.wrap{max-width:1280px}
.cover{border-radius:0;box-shadow:none}
.cover::after{background:linear-gradient(transparent 20%,rgba(8,25,21,.84))}
.cover h1,.art h1{font-family:"Playfair Display","Cormorant Garamond",Georgia,serif}
h2{font-family:"Playfair Display","Cormorant Garamond",Georgia,serif;color:var(--green)}
.card img{border-radius:0}
.card small,.art small{color:#9a7440;letter-spacing:.12em;text-transform:uppercase;font-size:10px}
.card h3{font-family:"Playfair Display","Cormorant Garamond",Georgia,serif}
.news{background:#eeeae1}
.news button{background:var(--green);border-radius:0}
.news input{border-radius:0}
footer{background:#0d211e;color:#e9e2d5}
footer .brand{color:#e8d4ac}
footer a{color:#e8d4ac}
.art{max-width:820px}
.art h1{color:var(--green)}
.prose{font-family:"DM Sans","Instrument Sans",Arial,sans-serif}
.prose blockquote{border-color:var(--gold);color:var(--green)}
@media(max-width:600px){.top{padding:19px 12px 14px}.brand{font-size:30px}nav{justify-content:flex-start;overflow-x:auto;white-space:nowrap}.art{padding:0 16px}}

</style>
<link rel="stylesheet" href="assets/css/ibc-shell.css">
</head><body id="top">


<main class="wrap" id="root"><p class="empty">Loading…</p></main>

<script>
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const href = a => a.link || (a.type === 'page' || !a.slug
  ? 'article.html?id=' + encodeURIComponent(a.id)
  : 'articles/' + encodeURIComponent(a.slug) + '/');
const sl = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'x';
const md = s => esc(s).split(/\n{2,}/).map(b => /^## /.test(b) ? '<h2>' + b.slice(3) + '</h2>' : '<p>' + b.replace(/\n/g, '<br>') + '</p>').join('').replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
const card = a => '<a class="card" href="' + esc(href(a)) + '"><img loading="lazy" src="' + esc(a.image) + '" alt=""><small>' + esc(a.category) + '</small><h3>' + esc(a.title) + '</h3>' + (a.excerpt ? '<p>' + esc(a.excerpt) + '</p>' : '') + '</a>';
const id = new URLSearchParams(location.search).get('id');
const canonicalBase = location.origin + location.pathname.replace(/article\\.html?$/i, '');
const absImg = v => !v ? '' : /^(https?:)/.test(v) ? v : new URL(v, canonicalBase).href;
fetch('content/articles.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : []).catch(() => []).then(list => {
  list = list.filter(a => a.status !== 'draft');
  const pages = list.filter(a => a.type === 'page'), posts = list.filter(a => a.type !== 'page');
  const S = ['cover', 'featured', 'trending'], cats = [...new Set(posts.filter(a => !S.includes(a.section)).map(a => a.category || 'More stories'))];
  const pl = f => pages.filter(f).map(a => '<a href="' + esc(href(a)) + '">' + esc(a.title) + '</a>').join('');
  nav.innerHTML = '<a href="index.html">Home</a>' + cats.map(c => '<a href="index.html#c-' + sl(c) + '">' + esc(c) + '</a>').join('') + pl(a => a.menu);
  fl.innerHTML = pl(a => a.footer !== false);
  const a = list.find(x => x.id === id), root = document.getElementById('root');
  if (!a) { root.innerHTML = '<p class="empty">Page not found. <a href="index.html"><u>Go to home</u></a></p>'; return; }
  document.title = a.title + ' | IBC BELLEZA LUXÉ';
  const setMeta = (key, value, prop='name') => {
    let m = document.querySelector('meta[' + prop + '="' + key + '"]');
    if (!m) { m = document.createElement('meta'); m.setAttribute(prop, key); document.head.appendChild(m); }
    m.setAttribute('content', value || '');
  };
  setMeta('description', a.excerpt || a.title);
  setMeta('og:title', a.title, 'property'); setMeta('og:description', a.excerpt || a.title, 'property');
  setMeta('og:type', 'article', 'property'); setMeta('og:image', absImg(a.image), 'property');
  setMeta('og:url', location.href, 'property'); setMeta('twitter:card', 'summary_large_image');
  setMeta('twitter:title', a.title); setMeta('twitter:description', a.excerpt || a.title); setMeta('twitter:image', absImg(a.image));
  const isPage = a.type === 'page';
  let h = '<article class="art">' + (isPage ? '' : '<small>' + esc(a.category) + (a.readTime ? ' • ' + esc(a.readTime) : '') + '</small>') + '<h1>' + esc(a.title) + '</h1>' +
    (!isPage && a.image ? '<img class="hero" src="' + esc(a.image) + '" alt="">' : '') + '<div class="prose">' + (a.format === 'html' ? a.body : md(a.body || '')) + '</div></article>';
  if (isPage) {
    const L = posts.filter(p => (p.showOn || []).includes(a.id) || (a.listCat && p.category === a.listCat));
    if (L.length) h += '<div class="grid" style="margin:40px 0">' + L.map(card).join('') + '</div>';
  }
  root.innerHTML = h;
});
</script><script src="assets/js/ibc-shell.js" data-root="" defer></script>
</body></html>
