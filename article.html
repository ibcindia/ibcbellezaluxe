<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IBC BELLEZA LUXÉ</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#1a1820;--mute:#6b6874;--line:#e6e3ea;--acc:#5b2a4e}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:16px/1.6 "Instrument Sans",system-ui,sans-serif}
a{color:var(--acc)}
.top{text-align:center;padding:18px 24px;border-bottom:1px solid var(--line)}
.brand{font:700 clamp(26px,5vw,36px) "Cormorant Garamond",Georgia,serif;letter-spacing:.04em;color:var(--ink);text-decoration:none}
main{max-width:760px;margin:0 auto;padding:36px 24px 80px}
.cat{color:var(--acc);font-weight:500;font-size:14px;margin:0}
h1{font:600 clamp(34px,6vw,54px)/1.08 "Cormorant Garamond",Georgia,serif;margin:6px 0 12px}
.lede{font-size:19px;color:var(--mute);margin:0 0 22px}
.hero{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:4px;margin-bottom:28px}
.prose{font:20px/1.75 "Cormorant Garamond",Georgia,serif}
.prose h2{font:600 32px/1.15 "Cormorant Garamond",Georgia,serif;margin:1.5em 0 .4em}
.prose blockquote{margin:1.2em 0;padding-left:18px;border-left:3px solid var(--acc);color:var(--acc);font-size:24px;font-style:italic}
.prose img{max-width:100%;height:auto;border-radius:4px}
.back{display:inline-block;margin-top:36px}
</style>
</head>
<body>
<header class="top"><a class="brand" href="index.html">IBC BELLEZA LUXÉ.</a></header>
<main id="m"><p>Loading…</p></main>
<script>
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const md = s => esc(s).split(/\n{2,}/).map(b => /^## /.test(b) ? '<h2>' + b.slice(3) + '</h2>' : /^&gt; /.test(b) ? '<blockquote>' + b.slice(5) + '</blockquote>' :
  /^- /.test(b) ? '<ul>' + b.split('\n').map(l => '<li>' + l.slice(2) + '</li>').join('') + '</ul>' : '<p>' + b.replace(/\n/g, '<br>') + '</p>').join('').replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
function clean(h) {
  const d = new DOMParser().parseFromString(h, 'text/html');
  d.querySelectorAll('script,style,iframe,object,embed,form,link,meta').forEach(n => n.remove());
  d.body.querySelectorAll('*').forEach(n => [...n.attributes].forEach(a => {
    if (/^on/i.test(a.name) || (/^(href|src)$/i.test(a.name) && /^\s*javascript:/i.test(a.value))) n.removeAttribute(a.name);
  }));
  return d.body.innerHTML;
}
const id = new URLSearchParams(location.search).get('id');
fetch('content/articles.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : []).catch(() => []).then(list => {
  const a = list.find(x => x.id === id && x.status !== 'draft'), m = document.getElementById('m');
  if (!a) { m.innerHTML = '<h1>Page not found</h1><p>This story may have moved or is not published yet.</p><a href="index.html">Back to home</a>'; return; }
  document.title = a.title + ' | IBC BELLEZA LUXÉ';
  const page = a.type === 'page';
  m.innerHTML = (page ? '' : '<p class="cat">' + esc(a.category) + (a.readTime ? ' • ' + esc(a.readTime) : '') + '</p>') +
    '<h1>' + esc(a.title) + '</h1>' + (!page && a.excerpt ? '<p class="lede">' + esc(a.excerpt) + '</p>' : '') +
    (!page && a.image ? '<img class="hero" src="' + esc(a.image) + '" alt="">' : '') +
    '<div class="prose">' + clean(a.format === 'html' ? a.body : md(a.body || '')) + '</div><a class="back" href="index.html">← Back to home</a>';
});
</script>
</body>
</html>
